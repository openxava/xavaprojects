server.servlet.context-path=/xavaprojects
server.tomcat.additional-tld-skip-patterns=htmlunit-*.jar,jetty-*.jar,c3p0-*.jar,mchange-commons-*.jar

spring.datasource.username=root
spring.datasource.password=openxava
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306?serverTimezone=GMT%2B2
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.openxava=DEBUG
